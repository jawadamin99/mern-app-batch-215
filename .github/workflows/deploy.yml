name: Mern Deploy EC2
on:
  push:
    branches:
      - main
jobs:
  deploy-ec2:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            /home/ubuntu/deploy.sh
  deploy-vps:
    runs-on: self-hosted
    steps:
      - name: Deploy on VPS
        run: |
          GIT_SHA=${{ github.sha }} /home/docker_projects/deploy-mern-blog.sh
          
          
